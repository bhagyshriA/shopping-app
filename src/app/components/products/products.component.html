<div class="container py-4">
  <h2 class="mb-3">Products</h2>

  <mat-tab-group animationDuration="200ms">
    <mat-tab *ngFor="let cat of categories" [label]="cat">
      <div class="row g-3 pt-3">
        <div class="col-12 col-sm-6 col-md-4 col-lg-3" *ngFor="let p of filtered(cat)">
          <mat-card class="h-100 product-card" [routerLink]="['/products', p.id]">
            <img mat-card-image [src]="p.image" [alt]="p.name" />
            <mat-card-content>
              <h5 class="mb-1">{{ p.name }}</h5>
              <small class="text-muted">{{ p.category }}</small>
              <div class="fw-bold mt-2">{{ p.price | currency }}</div>
            </mat-card-content>
          </mat-card>
        </div>
        <p *ngIf="!filtered(cat).length" class="text-muted">No products in this category.</p>
      </div>
    </mat-tab>
  </mat-tab-group>
</div>
