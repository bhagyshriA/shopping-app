<div class="container py-4" *ngIf="product">
  <a mat-button routerLink="/products"><mat-icon>arrow_back</mat-icon> Back to products</a>

  <div class="row mt-3 g-4">
    <div class="col-md-6">
      <img [src]="product.image" [alt]="product.name" class="img-fluid rounded shadow-sm w-100" />
    </div>
    <div class="col-md-6">
      <span class="badge bg-secondary">{{ product.category }}</span>
      <h2 class="mt-2">{{ product.name }}</h2>
      <h3 class="text-primary">{{ product.price | currency }}</h3>
      <p>{{ product.description }}</p>
      <p [class.text-danger]="product.stock < 15">In stock: {{ product.stock }}</p>
      <button mat-raised-button color="primary"><mat-icon>add_shopping_cart</mat-icon> Add to cart</button>
    </div>
  </div>
</div>
